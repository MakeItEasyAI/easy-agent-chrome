<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px -apple-system, system-ui, sans-serif; width: 280px; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    label { display: block; margin: 8px 0 2px; color: #444; }
    input { width: 100%; box-sizing: border-box; padding: 6px; }
    button { margin-top: 10px; padding: 6px 10px; }
    #result { margin-top: 10px; white-space: pre-wrap; color: #333; }
    .note { color: #888; font-size: 11px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>easy-agent (manual test)</h1>
  <label>Field label on the page</label>
  <input id="field" placeholder="e.g. Email" />
  <label>Value to type</label>
  <input id="value" placeholder="e.g. nikhil@example.com" />
  <button id="fill">Fill</button>
  <button id="list">List fields</button>
  <button id="ping">Check agent</button>
  <div id="result"></div>
  <div class="note">This never submits the form. Review and submit yourself.</div>
  <script src="popup.js"></script>
</body>
</html>
