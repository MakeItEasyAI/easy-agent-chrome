<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px -apple-system, system-ui, sans-serif; width: 300px; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 6px; }
    p { color: #444; margin: 6px 0; }
    code { background: #f2f2f2; padding: 1px 4px; border-radius: 3px; }
    button { margin-top: 8px; padding: 6px 10px; }
    #result { margin-top: 10px; white-space: pre-wrap; color: #333; font-size: 12px; }
    .note { color: #888; font-size: 11px; margin-top: 10px; }
    hr { border: 0; border-top: 1px solid #eee; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>easy-agent</h1>
  <p>Drive this from your terminal. Open the form in the front tab, then run:</p>
  <p><code>easy fill form</code></p>
  <p>The agent reads the form, fills it from your resume, and leaves the rest
     for you. It never submits.</p>

  <hr />
  <p class="note">Checks (optional):</p>
  <button id="ping">Check agent</button>
  <button id="list">List fields</button>
  <div id="result"></div>
  <div class="note">Never submits the form. Review and submit yourself.</div>
  <script src="popup.js"></script>
</body>
</html>
